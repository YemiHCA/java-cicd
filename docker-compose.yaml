
  services:
    web:
      build: ./frontend
#      image: yemmie69/java-inventory-frontend
      container_name: frontend
      ports:
        - "5173:5173"
      depends_on:
        api:
          condition: service_healthy

    api:
       build: ./backend
#      image: yemmie69/java-inventory-backend
      container_name: backend
      ports:
        - "8081:8080"
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/todo_db
        SPRING_DATASOURCE_USERNAME: todo_user
        SPRING_DATASOURCE_PASSWORD: todo_password
      depends_on:
        - db
      healthcheck:
        test: ["CMD-SHELL", "java -version >/dev/null 2>&1 && (curl -fsS http://localhost:8080/actuator/health || wget -q -O - http://localhost:8080/actuator/health) >/dev/null"]
        interval: 5s
        timeout: 5s
        retries: 10
        start_period: 30s

    db:
      image: postgres
      environment:
        POSTGRES_DB: todo_db
        POSTGRES_USER: todo_user
        POSTGRES_PASSWORD: todo_password
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql

  volumes:
     postgres_data:
